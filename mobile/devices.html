<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>Phones &amp; numbers · SMS Reader</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="m-view" data-view="mobile" data-root="../" data-nav="devices" data-needs-phone>
  <div class="m-phone">
    <div class="m-app">
      <header class="m-topbar" id="m-topbar"></header>
      <main class="m-content" id="card">
        <div class="m-head">
          <div class="header-text">
            <h1>Phones</h1>
            <p class="subtitle" id="devices-summary"></p>
          </div>
          <a class="btn" id="add-phone-btn" href="#" aria-label="Add phone">
            <span class="btn-icon" data-icon="plus"></span><span class="btn-label">Add phone</span>
          </a>
        </div>
        
        <p class="info-note">One login works on all your phones. Each phone can hold two SIMs. Use <strong>View</strong> to see one number, or the switcher at the top to see them all.</p>
        
        <div class="device-grid" id="device-list">
          <!-- Filled by js/devices.js -->
        </div>
      </main>
    </div>
    <nav class="m-tabbar" id="m-tabbar" aria-label="Main"></nav>
    <div class="m-dialog-shade"></div>
    <dialog class="modal modal-sm" id="remove-modal" aria-labelledby="remove-title">
      <div class="modal-card">
        <h2 id="remove-title">Remove?</h2>
        <p class="modal-sub" id="remove-text"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="button" class="btn btn-danger" id="remove-confirm-btn">Remove</button>
        </div>
      </div>
    </dialog>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/devices.js"></script>
</body>
</html>
