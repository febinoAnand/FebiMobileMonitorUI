<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Signed-out visitors go to the login page before anything is shown -->
  <script>(function () { var ok = false; try { var u = JSON.parse(localStorage.getItem("smsReader.user") || sessionStorage.getItem("smsReader.user")); ok = !!(u && u.expiresAt && Date.now() < u.expiresAt); } catch (e) {} if (!ok) { document.documentElement.style.visibility = "hidden"; location.replace("login.html"); } })();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>My phone · SMS Reader</title>
  <link rel="stylesheet" href="../css/styles.css?v=20261029b">
</head>
<body class="m-view" data-view="mobile" data-root="../" data-nav="devices">
  <div class="m-phone">
    <div class="m-app">
      <header class="m-topbar" id="m-topbar"></header>
      <main class="m-content" id="card">
        <div class="m-head">
          <div class="header-text">
            <h1>My phone</h1>
            <p class="subtitle" id="devices-summary"></p>
          </div>
        </div>
        
          <p class="info-note">Your account is linked to one phone. If it is dual SIM, you can read messages and calls from both SIMs together, or switch to one SIM at a time.</p>
        
        <div class="device-grid" id="device-list">
          <!-- Filled by js/devices.js -->
        </div>
      </main>
    </div>
    <nav class="m-tabbar" id="m-tabbar" aria-label="Main"></nav>
    <div class="m-dialog-shade"></div>
    <dialog class="modal modal-sm" id="remove-modal" aria-labelledby="remove-title">
      <div class="modal-card">
        <h2 id="remove-title">Remove?</h2>
        <p class="modal-sub" id="remove-text"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" data-close>Cancel</button>
          <button type="button" class="btn btn-danger" id="remove-confirm-btn">Remove</button>
        </div>
      </div>
    </dialog>
  </div>

  <script src="../js/data.js?v=20261029b"></script>
  <script src="../js/common.js?v=20261029b"></script>
  <script src="../js/devices.js?v=20261029b"></script>
</body>
</html>
