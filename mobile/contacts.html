<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Signed-out visitors go to the login page before anything is shown -->
  <script>(function () { var ok = false; try { var u = JSON.parse(localStorage.getItem("smsReader.user") || sessionStorage.getItem("smsReader.user")); ok = !!(u && u.expiresAt && Date.now() < u.expiresAt); } catch (e) {} if (!ok) { document.documentElement.style.visibility = "hidden"; location.replace("login.html"); } })();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>Contacts · SMS Reader</title>
  <link rel="stylesheet" href="../css/styles.css?v=20261028a">
</head>
<body class="m-view" data-view="mobile" data-root="../" data-nav="contacts">
  <div class="m-phone">
    <div class="m-app">
      <header class="m-topbar" id="m-topbar"></header>
      <main class="m-content" id="card">
        <div class="m-head">
          <div class="header-text">
            <h1>Contacts</h1>
            <p class="subtitle"><span id="contact-count">0</span> people who message <strong data-linked-number></strong></p>
          </div>
        </div>
        
        <div class="toolbar">
          <div class="search">
            <input type="search" id="search" placeholder="Search contacts" aria-label="Search contacts">
          </div>
          <div class="chips" id="label-filter" role="group" aria-label="Filter by label"></div>
        </div>
        
        <div class="contact-grid" id="contact-list">
          <!-- Filled by js/contacts.js -->
        </div>
      </main>
    </div>
    <nav class="m-tabbar" id="m-tabbar" aria-label="Main"></nav>
  </div>

  <script src="../js/data.js?v=20261028a"></script>
  <script src="../js/common.js?v=20261028a"></script>
  <script src="../js/contacts.js?v=20261028a"></script>
</body>
</html>
