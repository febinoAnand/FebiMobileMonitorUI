<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Signed-out visitors go to the login page before anything is shown -->
  <script>(function () { var ok = false; try { var u = JSON.parse(localStorage.getItem("smsReader.user") || sessionStorage.getItem("smsReader.user")); ok = !!(u && u.expiresAt && Date.now() < u.expiresAt); } catch (e) {} if (!ok) { document.documentElement.style.visibility = "hidden"; location.replace("login.html"); } })();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>Dashboard · SMS Reader</title>
  <link rel="stylesheet" href="../css/styles.css?v=20261029b">
</head>
<body class="m-view" data-view="mobile" data-root="../" data-nav="dashboard">
  <div class="m-phone">
    <div class="m-app">
      <header class="m-topbar" id="m-topbar"></header>
      <main class="m-content" id="card">
        <div class="m-head">
          <div class="header-text">
            <h1>Dashboard</h1>
            <p class="subtitle" id="greeting"></p>
          </div>
        </div>


        <section class="stat-grid" aria-label="Summary">
          <div class="panel stat-tile">
            <span class="stat-icon" data-icon="messages"></span>
            <strong class="stat-value" id="stat-messages">0</strong>
            <span class="stat-label">Messages</span>
          </div>
          <div class="panel stat-tile">
            <span class="stat-icon" data-icon="unread"></span>
            <strong class="stat-value" id="stat-unread">0</strong>
            <span class="stat-label">Unread</span>
          </div>
          <div class="panel stat-tile">
            <span class="stat-icon" data-icon="calls"></span>
            <strong class="stat-value" id="stat-calls">0</strong>
            <span class="stat-label">Calls</span>
          </div>
          <div class="panel stat-tile">
            <span class="stat-icon" data-icon="callMissed"></span>
            <strong class="stat-value" id="stat-missed">0</strong>
            <span class="stat-label">Missed calls</span>
          </div>
        </section>
        
        <section class="panel chart-panel">
          <div class="panel-header">
            <h2>Messages per day</h2>
            <small>Last 7 days</small>
          </div>
          <div class="chart">
            <div class="chart-axis" id="chart-axis" aria-hidden="true"></div>
            <div class="chart-plot" id="chart-plot"></div>
          </div>
          <table class="sr-only" id="chart-table">
            <caption>Messages per day, last 7 days</caption>
            <thead><tr><th>Day</th><th>Received</th><th>Sent</th><th>Total</th></tr></thead>
            <tbody></tbody>
          </table>
        </section>
        
        <section class="panel">
          <div class="panel-header">
            <h2>SIM cards</h2>
            <a class="panel-link" href="devices.html">Manage →</a>
          </div>
          <ul class="number-list" id="number-list"></ul>
        </section>
        
        <section class="panel">
          <div class="panel-header">
            <h2>Recent messages</h2>
            <a class="panel-link" href="messages.html">Inbox →</a>
          </div>
          <ul class="list" id="recent-list"></ul>
        </section>
        
        <section class="panel">
          <div class="panel-header">
            <h2>Recent calls</h2>
            <a class="panel-link" href="calls.html">Call log →</a>
          </div>
          <ul class="call-list" id="recent-calls"></ul>
        </section>
      </main>
    </div>
    <nav class="m-tabbar" id="m-tabbar" aria-label="Main"></nav>
  </div>

  <script src="../js/data.js?v=20261029b"></script>
  <script src="../js/common.js?v=20261029b"></script>
  <script src="../js/dashboard.js?v=20261029b"></script>
</body>
</html>
