<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Signed-out visitors go to the login page before anything is shown -->
  <script>(function () { var ok = false; try { var u = JSON.parse(localStorage.getItem("smsReader.user") || sessionStorage.getItem("smsReader.user")); ok = !!(u && u.expiresAt && Date.now() < u.expiresAt); } catch (e) {} if (!ok) { document.documentElement.style.visibility = "hidden"; location.replace("login.html"); } })();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>Calls · SMS Reader</title>
  <link rel="stylesheet" href="../css/styles.css?v=20261029b">
</head>
<body data-view="web" data-root="../" data-nav="calls">
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Main"></nav>

    <div class="page">
      <main class="card">
        <header class="page-header">
          <button class="icon-btn menu-btn" data-menu aria-label="Open menu">&#9776;</button>
          <div class="header-text">
            <h1>Calls</h1>
            <p class="subtitle">Call log for <strong data-linked-number></strong></p>
          </div>
          <button class="btn dialpad-open" id="dialpad-btn" type="button" aria-label="Dial pad"><span class="btn-icon" data-icon="keypad"></span><span class="btn-label">Dial pad</span></button>
          <button class="btn btn-ghost export-btn" id="export-btn" type="button" aria-label="Export"><span class="btn-icon" data-export-icon></span><span class="btn-label">Export</span></button>
        </header>

        <section class="call-stats" aria-label="Call totals">
          <div class="call-stat"><span class="call-stat-icon" data-icon="calls"></span><span><strong id="cs-total">0</strong><small>Calls</small></span></div>
          <div class="call-stat missed"><span class="call-stat-icon" data-icon="callMissed"></span><span><strong id="cs-missed">0</strong><small>Missed</small></span></div>
          <div class="call-stat rejected"><span class="call-stat-icon" data-icon="callRejected"></span><span><strong id="cs-rejected">0</strong><small>Rejected</small></span></div>
          <div class="call-stat talk"><span class="call-stat-icon" data-icon="clock"></span><span><strong id="cs-talk">0</strong><small>Talk time</small></span></div>
        </section>

        <div class="toolbar">
          <div class="search">
            <input type="search" id="search" placeholder="Search name or number" aria-label="Search calls">
          </div>
          <div class="chips" id="call-filter" role="group" aria-label="Filter calls"></div>
        </div>

        <div class="scroll">
          <ul class="call-list grouped" id="call-list">
            <!-- Filled by js/calls.js -->
          </ul>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js?v=20261029b"></script>
  <script src="../js/common.js?v=20261029b"></script>
  <script src="../js/calls.js?v=20261029b"></script>
  <script src="../js/export.js?v=20261029b"></script>
</body>
</html>
