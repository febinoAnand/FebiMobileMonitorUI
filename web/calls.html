<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>Calls · SMS Reader</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-view="web" data-root="../" data-nav="calls" data-needs-phone>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Main"></nav>

    <div class="page">
      <main class="card">
        <header class="page-header">
          <button class="icon-btn menu-btn" data-menu aria-label="Open menu">&#9776;</button>
          <div class="header-text">
            <h1>Calls</h1>
            <p class="subtitle">Call log for <strong data-linked-number></strong></p>
          </div>
        </header>

        <section class="call-stats" aria-label="Call totals">
          <div class="call-stat"><span class="call-stat-icon" data-icon="calls"></span><span><strong id="cs-total">0</strong><small>Calls</small></span></div>
          <div class="call-stat missed"><span class="call-stat-icon" data-icon="callMissed"></span><span><strong id="cs-missed">0</strong><small>Missed</small></span></div>
          <div class="call-stat rejected"><span class="call-stat-icon" data-icon="callRejected"></span><span><strong id="cs-rejected">0</strong><small>Rejected</small></span></div>
          <div class="call-stat talk"><span class="call-stat-icon" data-icon="clock"></span><span><strong id="cs-talk">0</strong><small>Talk time</small></span></div>
        </section>

        <div class="toolbar">
          <div class="search">
            <input type="search" id="search" placeholder="Search name or number" aria-label="Search calls">
          </div>
          <div class="chips" id="call-filter" role="group" aria-label="Filter calls"></div>
        </div>

        <div class="scroll">
          <ul class="call-list grouped" id="call-list">
            <!-- Filled by js/calls.js -->
          </ul>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/calls.js"></script>
</body>
</html>
