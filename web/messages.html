<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Signed-out visitors go to the login page before anything is shown -->
  <script>(function () { var ok = false; try { var u = JSON.parse(localStorage.getItem("smsReader.user") || sessionStorage.getItem("smsReader.user")); ok = !!(u && u.expiresAt && Date.now() < u.expiresAt); } catch (e) {} if (!ok) { document.documentElement.style.visibility = "hidden"; location.replace("login.html"); } })();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>Messages · SMS Reader</title>
  <link rel="stylesheet" href="../css/styles.css?v=20261029b">
</head>
<body data-view="web" data-root="../" data-nav="messages">
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Main"></nav>

    <div class="page">
      <main class="card">
        <header class="page-header">
          <button class="icon-btn menu-btn" data-menu aria-label="Open menu">&#9776;</button>
          <div class="header-text">
            <div class="title-row">
              <h1>Messages</h1>
              <span class="badge" id="unread-count" hidden>0</span>
            </div>
            <p class="subtitle">Inbox for <strong data-linked-number></strong></p>
          </div>
          <button class="btn btn-ghost export-btn" id="export-btn" type="button" aria-label="Export"><span class="btn-icon" data-export-icon></span><span class="btn-label">Export</span></button>
        </header>

        <div class="toolbar">
          <div class="search">
            <input type="search" id="search" placeholder="Search name, number or message" aria-label="Search messages">
          </div>
          <div class="chips" id="inbox-filter" role="group" aria-label="Filter conversations"></div>
        </div>

        <div class="scroll">
          <ul class="list" id="thread-list">
            <!-- Filled by js/inbox.js -->
          </ul>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js?v=20261029b"></script>
  <script src="../js/common.js?v=20261029b"></script>
  <script src="../js/inbox.js?v=20261029b"></script>
  <script src="../js/export.js?v=20261029b"></script>
</body>
</html>
