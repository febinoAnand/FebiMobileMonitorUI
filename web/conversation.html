<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Signed-out visitors go to the login page before anything is shown -->
  <script>(function () { var ok = false; try { var u = JSON.parse(localStorage.getItem("smsReader.user") || sessionStorage.getItem("smsReader.user")); ok = !!(u && u.expiresAt && Date.now() < u.expiresAt); } catch (e) {} if (!ok) { document.documentElement.style.visibility = "hidden"; location.replace("login.html"); } })();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>Conversation · SMS Reader</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-view="web" data-root="../" data-nav="messages">
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Main"></nav>

    <div class="page page-wide">
      <main class="card" id="card">
        <header class="bar-header">
          <a class="icon-btn" id="back-btn" href="messages.html" aria-label="Back to messages">&#8592;</a>
          <a class="contact-trigger" id="contact-link" href="#" aria-label="View contact info">
            <span class="avatar" id="conv-avatar"></span>
            <span class="contact-trigger-text">
              <strong id="conv-name"></strong>
              <small id="conv-number"></small>
            </span>
          </a>
          <a class="icon-btn" id="info-link" href="#" aria-label="Contact info">&#9432;</a>
          <button class="icon-btn menu-btn" data-menu aria-label="Open menu">&#9776;</button>
        </header>

        <section class="scroll message-list" id="message-list">
          <!-- Filled by js/conversation.js -->
        </section>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/conversation.js"></script>
</body>
</html>
